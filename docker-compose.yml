# Codex — Stage 1 (AST chunking) + Stage 2 (embeddings & pgvector search).
#
# `docker compose up` runs the backend + a local Postgres/pgvector database.
# Provide secrets via backend/.env (copy from backend/.env.example). At minimum
# set GEMINI_API_KEY there; DATABASE_URL defaults below point at the `db` service.

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      # Optional: the stack starts without it (embedding endpoints then return a
      # clear 503 until GEMINI_API_KEY is provided).
      - path: ./backend/.env
        required: false
    environment:
      # Overrides env_file: inside the compose network the DB host is `db`.
      CODEX_WORKDIR: /data/repos
      DATABASE_URL: postgresql://codex:codex@db:5432/codex
    volumes:
      # Persist cloned repos across restarts (and let you inspect them).
      - repos:/data/repos
    depends_on:
      db:
        condition: service_healthy

  # Local Postgres with the pgvector extension (Supabase-compatible).
  # To use hosted Supabase instead: delete this service + depends_on, and point
  # DATABASE_URL in backend/.env at your Supabase connection string.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: codex
      POSTGRES_PASSWORD: codex
      POSTGRES_DB: codex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex -d codex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  repos:
  pgdata:
